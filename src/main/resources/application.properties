spring.application.name=laforse-web
server.port=8080
spring.thymeleaf.cache=false

# ---------- Base de datos MySQL ----------
# Cambie usuario y clave por los de su MySQL local. La BD se crea sola si no existe.
spring.datasource.url=jdbc:mysql://localhost:3306/laforse_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=root

# ---------- JPA / Hibernate ----------
# update: crea o actualiza las tablas a partir de las entidades (@Entity)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Datos de contacto mostrados en el pie de pagina y en /contacto
# (los .properties se leen en ISO-8859-1, por eso las tildes van como \\uXXXX)
laforse.contacto.correo=contacto@laforse-hg.com
laforse.contacto.telefono=+51 900 000 000
laforse.contacto.ciudad=Lima, Per\u00fa
