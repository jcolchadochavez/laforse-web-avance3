<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Página no disponible')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="lf-main d-flex align-items-center">
  <div class="container py-5 text-center">
    <p class="eyebrow mb-2">Error <span th:text="${status}">404</span></p>
    <h1 class="display-5 mb-3" th:text="${status == 404} ? 'No encontramos esta página' : 'Ocurrió un problema'">No encontramos esta página</h1>
    <p class="text-muted mb-4" th:text="${mensaje != null} ? ${mensaje} : 'La evidencia de esta ruta no existe o fue movida. Vuelva al inicio o revise nuestros servicios.'">La evidencia de esta ruta no existe o fue movida.</p>
    <a th:href="@{/}" class="btn btn-lf me-2">Ir al inicio</a>
    <a th:href="@{/servicios}" class="btn btn-outline-dark">Ver servicios</a>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
