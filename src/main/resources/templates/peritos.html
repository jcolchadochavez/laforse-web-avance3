<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Peritos')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="lf-main">
  <header th:replace="~{fragments/layout :: pageHeader('Gestión', 'Peritos del laboratorio', 'Equipo técnico que recibe y atiende los casos. Un perito con casos asignados no se elimina: se desactiva.')}"></header>

  <section class="py-5 section-soft">
    <div class="container">
      <div th:replace="~{fragments/layout :: alertas}"></div>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <p class="small text-muted mb-0"><strong th:text="${#lists.size(peritos)}">3</strong> peritos registrados</p>
        <a th:href="@{/peritos/nuevo}" class="btn btn-lf"><i class="bi bi-person-plus"></i> Nuevo perito</a>
      </div>

      <div class="table-responsive rounded-3 shadow-sm">
        <table class="table table-lf table-striped table-hover align-middle mb-0 bg-white">
          <thead>
            <tr><th>Nombres</th><th>Especialidad</th><th class="d-none d-md-table-cell">Correo</th>
                <th class="d-none d-lg-table-cell">Celular</th><th class="text-center">Casos</th><th>Estado</th><th class="text-end">Acciones</th></tr>
          </thead>
          <tbody>
            <tr th:each="p : ${peritos}">
              <td class="fw-semibold" th:text="${p.nombres}">Nombre</td>
              <td th:text="${p.especialidad}">Especialidad</td>
              <td class="d-none d-md-table-cell small" th:text="${p.correo}">correo</td>
              <td class="d-none d-lg-table-cell font-mono small" th:text="${p.telefono} ?: '—'">9...</td>
              <td class="text-center" th:text="${casosPorPerito.get(p.id)}">0</td>
              <td>
                <span th:if="${p.activo}" class="badge text-bg-success"><i class="bi bi-check-circle"></i> Activo</span>
                <span th:unless="${p.activo}" class="badge text-bg-secondary"><i class="bi bi-pause-circle"></i> Inactivo</span>
              </td>
              <td class="text-end text-nowrap">
                <a th:href="@{/peritos/{id}/editar(id=${p.id})}" class="btn btn-outline-primary btn-sm btn-accion" title="Editar"><i class="bi bi-pencil"></i></a>
                <button type="button" class="btn btn-outline-danger btn-sm btn-accion" title="Eliminar"
                        data-bs-toggle="modal" data-bs-target="#modalEliminar"
                        th:data-nombre="'al perito ' + ${p.nombres}" th:data-url="@{/peritos/{id}/eliminar(id=${p.id})}"><i class="bi bi-trash"></i></button>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(peritos)}">
              <td colspan="7" class="text-center text-muted py-4">Aún no hay peritos registrados.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<div th:replace="~{fragments/layout :: modalEliminar}"></div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
